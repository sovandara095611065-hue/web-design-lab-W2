<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url('https://i.pinimg.com/1200x/a9/b7/d5/a9b7d53839398825fb75cbde0862ac2c.jpg');
            background-size: cover;  
            background-repeat: no-repeat;
            background-attachment: fixed; 
            color:aliceblue
        }

        .header{
            display: grid;
            grid-template-columns: 50% 50%;
        }

        .title {
            color: goldenrod;
            text-align: start;
            padding-left: 8 0px;
            font-size: 40px;
        }

        ul, li{
            display: inline;
            margin: 20px;
        }

        .text{
            display: grid;
            justify-content: center;  
            text-align: center;
        }

        .button {
            background-color: goldenrod;
            width: 240px;
            padding: 10px;
            text-align: center;
            justify-content: center;  
            border-radius: 10px;
            margin: 0 auto;
        }

        .text h2{
            font-size: 40px;
            margin-bottom: 0;
        }

        .text h1{
            font-size: 70px;
            margin-top: 10px;
        }


    </style>
</head>
<body>
    <header>
        <div class="header">
            
            <h1 class="title">
                <b>Start Bootstrap</b>
            </h1>
    
            <ul class="nav">
                <li>SERVICES</li>
                <li>PORTFOLIO</li>
                <li>ABOUT</li>
                <li>TEAM</li>
                <li>CONTACT</li>
            </ul>
        </div>
    </header>

    <div class="text">
        
        <h2>Welcome To Our Studio!</h2>
    
        <h1><b>IT'S NICE TO MEET YOU</b></h1>
    
        <div class="button">
            <p><b>TELL ME MORE</b></p>
        </div>

    </div>

</body>
</html>
